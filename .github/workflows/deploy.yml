name: Deploy storefront to GitHub Pages

# Deploys `main`. (Previously this only ran on the hand-synced `storefront-react`
# deploy branch, which is an orphan history — `git merge-base main storefront-react`
# returns nothing — so merges to main never reached the live site and it fell a
# month behind. See DEPLOYMENT.md §1.)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Data and deploy-config guards. Both run on plain Node, need no extra
      # packages, and fail in seconds — a bad `vercel.json` or a duplicate
      # product slug should never reach a dashboard or a live grid.
      - name: Verify catalogue and deploy config
        run: npm run verify:catalog && npm run verify:config

      - name: Build
        run: npm run build:pages
        env:
          # Optional repository secret. Set it to the API origin
          # (https://your-api-host) and the deployed storefront talks to the
          # real backend. Leave it unset and the site stays in demo mode.
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
